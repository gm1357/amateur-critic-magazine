<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="960">
  <!-- The grain of the desk's walnut, as light streaks with alpha over the board's own
       colour. Noise stretched along the x axis reads as fibres running down a board; a
       second, much broader noise displaces it so the fibres wander the way real grain does
       instead of ruling dead straight across the screen. The filter is run over a margin
       wider than the tile, because a displacement samples from up to half its scale away
       and would pull empty pixels in at the edges. -->
  <filter id="grain" filterUnits="userSpaceOnUse" x="-60" y="-60" width="2040" height="1080">
    <feTurbulence type="fractalNoise" baseFrequency="0.0016 0.008" numOctaves="2" seed="3" result="wander" />
    <feTurbulence type="fractalNoise" baseFrequency="0.0022 0.05" numOctaves="3" seed="11" result="fibre" />
    <feDisplacementMap in="fibre" in2="wander" scale="60" xChannelSelector="R" yChannelSelector="G" />
    <feColorMatrix values="0 0 0 0 0.56  0 0 0 0 0.36  0 0 0 0 0.2  1.1 0 0 0 -0.42" />
  </filter>
  <rect x="-60" y="-60" width="2040" height="1080" filter="url(#grain)" />
</svg>
